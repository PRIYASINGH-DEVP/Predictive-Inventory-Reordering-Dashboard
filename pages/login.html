<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in - StockPilot</title>
<link rel="icon" href="../icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('sp:theme'))||'dark'}catch(e){}</script>
</head>
<body data-auth="login">
<canvas id="bg3d" aria-hidden="true"></canvas>
<main class="auth"><div class="auth-card glass"><a class="brand" href="login.html" style="padding:0"><span class="logo"></span>StockPilot</a><h1>Log in</h1><p>Check stock, orders and AI forecasts.</p><div style="height:18px"></div><div id="msg" class="msg" role="status" hidden></div>
<form id="form" novalidate><div class="fg"><label class="f" for="email">Email</label><input class="in" id="email" type="email" autocomplete="email" aria-describedby="email-e"><div class="err-t" id="email-e" role="alert"></div></div><div class="fg"><label class="f" for="password">Password</label><div class="pw"><input class="in" id="password" type="password" autocomplete="current-password" aria-describedby="password-e"><button type="button" data-eye="password" aria-label="Show password">Show</button></div><div class="err-t" id="password-e" role="alert"></div></div><div class="row between" style="margin-bottom:16px"><label class="row" style="font-size:13px"><input type="checkbox" id="remember"> Remember me</label><a href="forgot-password.html" style="font-size:13px">Forgot password?</a></div><button class="btn full" id="btn" type="submit">Log in</button></form><p style="margin-top:16px;text-align:center">New here? <a href="signup.html">Create an account</a></p></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../assets/js/data/seed.js"></script>
<script src="../assets/js/core/core.js"></script>
<script src="../assets/js/effects/scene.js"></script>
<script src="../assets/js/auth/auth.js"></script>
</body></html>
